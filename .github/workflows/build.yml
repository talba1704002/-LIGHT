name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project folder
        id: find
        run: |
          F=$(find . -name settings.gradle | head -n 1)
          if [ -z "$F" ]; then
            echo "No settings.gradle found. Files in repo:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" TalhaLight.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalhaLight-apk
          path: TalhaLight.apk
